services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg17-trixie
    container_name: rag-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PWD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag-user -d rag-db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend API
  api:
    build:
      context: ..
      dockerfile: rag-backend/Dockerfile
    container_name: rag-backend
    env_file:
      - .env
    environment:
      - APP_ENV=production
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ${HOST_STORAGE_PATH:-./knowledge_base}:/app/knowledge_base
      - temp_files:/app/temp
      - hf_cache:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: ..
      dockerfile: rag-backend/Dockerfile
    container_name: rag_worker
    env_file:
      - .env
    environment:
      - APP_ENV=production
    command: python worker.py
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ${HOST_STORAGE_PATH:-./knowledge_base}:/app/knowledge_base
      - temp_files:/app/temp
      - hf_cache:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      replicas: ${WORKERS_COUNT:-1}
      restart_policy:
        condition: on-failure

volumes:
  postgres_data:
  redis_data:
  temp_files:
  hf_cache:
